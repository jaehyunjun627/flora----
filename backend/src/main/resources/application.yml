server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ========================
  # Oracle (JPA) 설정
  # ========================
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${DB_USERNAME:system}
    password: ${DB_PASSWORD:12345}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.OracleDialect

  # ========================
  # MongoDB 설정
  # ========================
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/flora}

  # ========================
  # 파일 업로드
  # ========================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ========================
# JWT 설정
# ========================
jwt:
  secret: ${JWT_SECRET:FloraSecretKey2026FloraSecretKey2026MustBeAtLeast64CharactersLongForHS256}
  expiration: ${JWT_EXPIRATION:1800000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

# ========================
# 외부 API
# ========================
external:
  pixabay:
    api-key: ${PIXABAY_API_KEY:}
  forest:
    api-key: ${FOREST_API_KEY:}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini

# ========================
# 파일 업로드 경로
# ========================
file:
  upload-dir: ${UPLOAD_DIR:uploads}

# ========================
# 로깅
# ========================
logging:
  level:
    com.flora.backend: INFO
    org.hibernate.SQL: WARN
