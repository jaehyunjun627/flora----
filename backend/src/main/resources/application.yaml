spring:
  application:
    name: demo

  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: system
    password: 12345
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

server:
  port: 8080