const fmt = n => Number(n).toLocaleString('ko-KR') + '원';
const fmtDist = d => d < 1 ? `${Math.round(d*1000)}m` : `${d.toFixed(1)}km`;
function haversine(la1,lo1,la2,lo2){
  const R=6371,dL=(la2-la1)*Math.PI/180,dO=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dO/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function timeAgo(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return '방금 전';
  if(s<3600) return `${Math.floor(s/60)}분 전`;
  if(s<86400) return `${Math.floor(s/3600)}시간 전`;
  return `${Math.floor(s/86400)}일 전`;
}

function App() {
  const [db, setDB] = useState(() => DB.load() || getInitialData());
  const [tab, setTab] = useState('trade');
  const [userLoc, setUserLoc] = useState(null);
  const [locLoading, setLocLoading] = useState(false);
  const [locDenied, setLocDenied] = useState(false);

  useEffect(() => { DB.save(db); }, [db]);

  const mutate = useCallback(fn => setDB(prev => { const n = {...prev}; fn(n); return n; }), []);

  const requestLoc = () => {
    setLocLoading(true);
    navigator.geolocation.getCurrentPosition(
      pos => {
        const {latitude:lat, longitude:lng} = pos.coords;
        setUserLoc({lat,lng});
        setLocLoading(false);
        mutate(d => {
          d.tradePosts = d.tradePosts.map(p => ({...p, distance: parseFloat(haversine(lat,lng,p.lat,p.lng).toFixed(1))}))
            .sort((a,b) => a.distance - b.distance);
          d.festivals = d.festivals.map(f => ({...f, distance: parseFloat(haversine(lat,lng,f.lat,f.lng).toFixed(1))}))
            .sort((a,b) => a.distance - b.distance);
        });
      },
      () => { setLocLoading(false); setLocDenied(true); }
    );
  };

  const tabs = [
    { key:'community', emoji:'💬', label:'커뮤니티' },
    { key:'festival',  emoji:'🎪', label:'지역축제' },
    { key:'trade',     emoji:'🌿', label:'지역거래' },
  ];

  return (
    <div className="app-wrap">
      <Header tab={tab} userLoc={userLoc} onLocClick={requestLoc} locLoading={locLoading} />
      <div className="page-content">
        {tab==='trade'     && <TradeTab     db={db} mutate={mutate} userLoc={userLoc} locDenied={locDenied} onLocRequest={requestLoc} locLoading={locLoading} />}
        {tab==='festival'  && <FestivalTab  db={db} userLoc={userLoc} />}
        {tab==='community' && <CommunityTab db={db} mutate={mutate} />}
      </div>
      <nav className="bottom-nav">
        {tabs.map(t => (
          <button key={t.key} className={`nav-item ${tab===t.key?'active':''}`} onClick={()=>setTab(t.key)}>
            <span>{t.emoji}</span><span>{t.label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

            <div style={{position:'relative'}}>
              <input type="number" placeholder="0" value={f.price} onChange={e=>set('price',e.target.value)} style={{paddingRight:36,borderColor:errors.price?'#e53935':undefined}} />
              <span style={{position:'absolute',right:13,top:'50%',transform:'translateY(-50%)',color:'#aaa',fontSize:13}}>원</span>
            </div>
            {errors.price&&<div className="err-msg">{errors.price}</div>}
          </div>
          <div className="form-group">
            <label className="form-label">상세 설명 *</label>
            <textarea placeholder="식물 크기, 상태, 거래 방법 등을 적어주세요" value={f.desc} onChange={e=>set('desc',e.target.value)} style={{borderColor:errors.desc?'#e53935':undefined}} />
            {errors.desc&&<div className="err-msg">{errors.desc}</div>}
          </div>
          <div className="form-group">
            <label className="form-label">거래 지역 *</label>
            <input placeholder="예: 마포구 합정동" value={f.location} onChange={e=>set('location',e.target.value)} style={{borderColor:errors.location?'#e53935':undefined}} />
            {errors.location&&<div className="err-msg">{errors.location}</div>}
          </div>
          <div className="form-group">
            <label className="form-label">닉네임</label>
            <input placeholder="닉네임" value={f.seller} onChange={e=>set('seller',e.target.value)} />
          </div>
          <div style={{paddingBottom:20}}>
            <button className="btn-primary" onClick={()=>validate()&&onSubmit({...f,price:Number(f.price)})}>🌿 글 올리기</button>
          </div>
        </div>
      </div>
    </div>
  );
}

const FEST_CATS = ['전체','꽃축제','수목원','마켓','체험'];

function FestivalTab({ db, userLoc }) {
  const [cat, setCat] = useState('전체');
  const [detail, setDetail] = useState(null);

  const festivals = db.festivals.filter(f => cat==='전체' || f.category===cat);

  const today = new Date();
  const isOngoing = f => new Date(f.start)<=today && today<=new Date(f.end);
  const isUpcoming = f => new Date(f.start)>today;
  const daysLeft = f => {
    const diff = Math.ceil((new Date(f.end)-today)/(1000*60*60*24));
    return diff;
  };

  return (
    <>
      <div className="cat-scroll">
        {FEST_CATS.map(c=>(
          <button key={c} className={`cat-btn ${cat===c?'active':'inactive'}`} onClick={()=>setCat(c)}>{c}</button>
        ))}
      </div>

      <div style={{padding:'0 16px 12px',display:'flex',alignItems:'center',gap:6}}>
        <span style={{fontSize:12,color:'#aaa'}}>
          {userLoc ? '📍 가까운 거리 순' : '📍 위치를 설정하면 가까운 축제를 먼저 보여줘요'}
        </span>
      </div>

      {festivals.length===0 ? (
        <div className="empty"><div className="icon">🎪</div><div className="title">해당 카테고리 축제가 없어요</div></div>
      ) : festivals.map(f => {
        const ongoing = isOngoing(f);
        const upcoming = isUpcoming(f);
        const left = daysLeft(f);
        return (
          <div key={f.id} className="festival-card" onClick={()=>setDetail(f)}>
            <div className="festival-emoji-box" style={{background:f.color}}>{f.emoji}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:5,flexWrap:'wrap'}}>
                {ongoing && <span style={{background:'#e8f5e9',color:'#2e7d32',padding:'2px 8px',borderRadius:20,fontSize:11,fontWeight:700}}>진행중</span>}
                {upcoming && <span style={{background:'#e3f2fd',color:'#1565c0',padding:'2px 8px',borderRadius:20,fontSize:11,fontWeight:700}}>예정</span>}
                {!upcoming && !ongoing && <span style={{background:'#f0f0f0',color:'#999',padding:'2px 8px',borderRadius:20,fontSize:11,fontWeight:700}}>종료</span>}
                <span className={FEST_CAT_COLORS[f.category]||'chip'}>{f.category}</span>
              </div>
              <div style={{fontSize:15,fontWeight:700,marginBottom:4,lineHeight:1.3}}>{f.name}</div>
              <div style={{fontSize:12,color:'#888',marginBottom:5}}>
                📍 {f.location}
                {userLoc && <span style={{color:'#4CAF50',fontWeight:600}}> · {fmtDist(f.distance)}</span>}
              </div>
              <div className="date-badge">
                📅 {f.start} ~ {f.end}
                {ongoing && left>=0 && <span>· D-{left}</span>}
              </div>
              <div style={{marginTop:6}}>
                {f.tags.map(t=>(
                  <span key={t} className="festival-tag chip-purple" style={{fontSize:10}}># {t}</span>
                ))}
              </div>
            </div>
          </div>
        );
      })}

      {detail && <FestivalDetailModal f={detail} onClose={()=>setDetail(null)} userLoc={userLoc} />}
    </>
  );
}

          <div style={{marginBottom:20}}>

          </div>
          <button className="btn-primary" style={{marginBottom:8}} onClick={()=>alert('지도 연동 기능은 준비 중이에요 🗺️')}>🗺️ 지도에서 보기</button>
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════

const COMM_CATS = ['전체','식물이야기','질문','자유','나눔'];

function CommunityTab({ db, mutate }) {
  const [cat, setCat] = useState('전체');
  const [detail, setDetail] = useState(null);
  const [showWrite, setShowWrite] = useState(false);
  const [editPost, setEditPost] = useState(null);

  const posts = db.communityPosts.filter(p => cat==='전체' || p.category===cat);

  const openDetail = p => {
    mutate(d => { const idx=d.communityPosts.findIndex(x=>x.id===p.id); if(idx>=0) d.communityPosts[idx].views++; });
    setDetail({...p, views:(p.views||0)+1});
  };

  const toggleLike = id => {
    mutate(d => { d.communityPosts = d.communityPosts.map(p => p.id===id?{...p,liked:!p.liked,likes:p.liked?p.likes-1:p.likes+1}:p); });
    if(detail?.id===id) setDetail(prev=>({...prev,liked:!prev.liked,likes:prev.liked?prev.likes-1:prev.likes+1}));
  };

  const handlePost = (post, isEdit) => {
    if(isEdit) {
      mutate(d => { d.communityPosts=d.communityPosts.map(p=>p.id===post.id?{...p,...post}:p); });
    } else {
      mutate(d => { d.communityPosts.unshift({...post,id:Date.now(),time:'방금 전',ts:Date.now(),views:0,likes:0,liked:false,comments:[]}); });
    }
    setShowWrite(false); setEditPost(null);
  };

  const handleDelete = id => {
    mutate(d => { d.communityPosts=d.communityPosts.filter(p=>p.id!==id); });
    setDetail(null);
  };

  const addComment = (postId, comment) => {
    mutate(d => {
      const idx=d.communityPosts.findIndex(p=>p.id===postId);
      if(idx>=0) d.communityPosts[idx].comments.push(comment);
    });
    if(detail?.id===postId) setDetail(prev=>({...prev,comments:[...prev.comments,comment]}));
  };

  const toggleCommentLike = (postId, commentId) => {
    mutate(d => {
      const p=d.communityPosts.find(x=>x.id===postId);
      if(p) p.comments=p.comments.map(c=>c.id===commentId?{...c,liked:!c.liked,likes:c.liked?c.likes-1:c.likes+1}:c);
    });
    if(detail?.id===postId) setDetail(prev=>({...prev,comments:prev.comments.map(c=>c.id===commentId?{...c,liked:!c.liked,likes:c.liked?c.likes-1:c.likes+1}:c)}));
  };

  return (
    <>
      <div className="cat-scroll">
        {COMM_CATS.map(c=><button key={c} className={`cat-btn ${cat===c?'active':'inactive'}`} onClick={()=>setCat(c)}>{c}</button>)}
      </div>

      {posts.length===0 ? (
        <div className="empty"><div className="icon">🌱</div><div className="title">첫 글을 남겨보세요!</div><div className="sub">식물 이야기, 질문, 나눔 무엇이든 환영해요</div></div>
      ) : posts.map(p=>(
        <div key={p.id} className="comm-card" onClick={()=>openDetail(p)}>
          <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6}}>
            <span className={CAT_COLORS[p.category]||'chip'}>{p.category}</span>
            <span style={{fontSize:11,color:'#bbb'}}>{p.time}</span>
          </div>
          <div className="comm-card-title">{p.title}</div>
          <div className="comm-card-preview">{p.content}</div>
          <div className="comm-stats">
            <span className="comm-stat">👁 {p.views||0}</span>
            <span className="comm-stat">❤️ {p.likes||0}</span>
            <span className="comm-stat">💬 {p.comments?.length||0}</span>
            <span style={{marginLeft:'auto',fontSize:11,color:'#bbb'}}>{p.author}</span>
          </div>
        </div>
      ))}

      <button className="fab" onClick={()=>setShowWrite(true)}>✏️ 글쓰기</button>

      {detail && (
        <CommunityDetailModal
          post={db.communityPosts.find(p=>p.id===detail.id)||detail}
          onClose={()=>setDetail(null)}
          onLike={toggleLike}
          onEdit={p=>{setEditPost(p);setShowWrite(true);}}
          onDelete={handleDelete}
          onAddComment={addComment}
          onCommentLike={toggleCommentLike}
        />
      )}
      {showWrite && <CommWriteModal onClose={()=>{setShowWrite(false);setEditPost(null);}} onSubmit={handlePost} editData={editPost} />}
    </>
  );
}

function CommunityDetailModal({ post, onClose, onLike, onEdit, onDelete, onAddComment, onCommentLike }) {
  const [menuOpen, setMenuOpen] = useState(false);
  const [commentText, setCommentText] = useState('');
  const [author, setAuthor] = useState('');
  const menuRef = useRef();

  useEffect(()=>{
    const close = e => { if(menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown',close);
    return ()=>document.removeEventListener('mousedown',close);
  },[]);

  const submitComment = () => {
    if(!commentText.trim()) return;
    onAddComment(post.id, {id:Date.now(),author:author.trim()||'익명',text:commentText.trim(),time:'방금 전',ts:Date.now(),likes:0,liked:false});
    setCommentText('');
  };

  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" style={{maxHeight:'95vh'}} onClick={e=>e.stopPropagation()}>
        <div className="sheet-handle"><div className="sheet-handle-bar"/></div>
        <div style={{padding:'4px 20px 0',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <span className={CAT_COLORS[post.category]||'chip'}>{post.category}</span>
            <span style={{fontSize:12,color:'#bbb'}}>{post.time}</span>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:4,position:'relative'}} ref={menuRef}>
            <button className="btn-ghost" onClick={onClose} style={{fontSize:17}}>✕</button>
            <button className="btn-ghost" style={{fontSize:18,padding:'5px 8px'}} onClick={()=>setMenuOpen(v=>!v)}>⋯</button>
            {menuOpen && (
              <div className="action-menu">
                <button onClick={()=>{setMenuOpen(false);onEdit(post);}}>✏️ 수정하기</button>
                <button style={{color:'#e53935'}} onClick={()=>{if(confirm('정말 삭제할까요?')){onDelete(post.id);}}}>🗑 삭제하기</button>
              </div>
            )}
          </div>
        </div>

        <div style={{padding:'12px 20px 0'}}>
          <h2 style={{fontSize:19,fontWeight:800,lineHeight:1.35,marginBottom:10}}>{post.title}</h2>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
            <div style={{width:34,height:34,borderRadius:'50%',background:'linear-gradient(135deg,#a5d6a7,#66bb6a)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16}}>👤</div>
            <div>
              <div style={{fontSize:13,fontWeight:600}}>{post.author}</div>
              <div className="meta"><span>👁 {post.views||0}</span><span>❤️ {post.likes||0}</span><span>💬 {post.comments?.length||0}</span></div>
            </div>
          </div>

          <p style={{fontSize:14,color:'#444',lineHeight:1.8,whiteSpace:'pre-wrap',marginBottom:16}}>{post.content}</p>

          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',paddingTop:12,borderTop:'1px solid #f0f0f0',marginBottom:16}}>
            <button className={`like-btn ${post.liked?'liked':''}`} onClick={()=>onLike(post.id)} style={{fontSize:14,gap:5}}>
              {post.liked?'❤️':'🤍'} 좋아요 {post.likes||0}
            </button>
            <button className="btn-ghost" style={{fontSize:13}} onClick={()=>document.getElementById('comment-input')?.focus()}>
              💬 댓글 {post.comments?.length||0}
            </button>
          </div>
        </div>

        <div className="thick-divider"/>

        {/* 댓글 섹션 */}
        <div style={{padding:'14px 20px 0'}}>
          <div style={{fontSize:14,fontWeight:700,marginBottom:12,color:'#333'}}>댓글 {post.comments?.length||0}개</div>
          {(!post.comments||post.comments.length===0) ? (
            <div style={{textAlign:'center',padding:'20px 0',color:'#ccc',fontSize:13}}>첫 댓글을 남겨보세요 🌱</div>
          ) : post.comments.map(c=>(
            <div key={c.id} className="comment-item">
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                <div style={{width:28,height:28,borderRadius:'50%',background:'#e8f5e9',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,flexShrink:0}}>🌿</div>
                <span className="comment-author">{c.author}</span>
                <span style={{fontSize:11,color:'#ccc'}}>{c.time}</span>
              </div>
              <div className="comment-text" style={{paddingLeft:36}}>{c.text}</div>
              <div className="comment-meta" style={{paddingLeft:36}}>
                <button className={`like-btn ${c.liked?'liked':''}`} style={{fontSize:12,padding:'3px 6px'}} onClick={()=>onCommentLike(post.id,c.id)}>
                  {c.liked?'❤️':'🤍'} {c.likes||0}
                </button>
              </div>
            </div>
          ))}
        </div>

        {/* 댓글 입력 */}
        <div style={{padding:'14px 20px',borderTop:'1px solid #f0f0f0',position:'sticky',bottom:0,background:'#fff'}}>
          <input id="comm-author-input" placeholder="닉네임 (선택)" value={author} onChange={e=>setAuthor(e.target.value)} style={{marginBottom:8,fontSize:13,padding:'9px 12px'}} />
          <div style={{display:'flex',gap:8}}>
            <textarea id="comment-input" placeholder="댓글을 입력해주세요..." value={commentText} onChange={e=>setCommentText(e.target.value)}
              style={{flex:1,minHeight:44,resize:'none',fontSize:14,padding:'10px 12px'}}
              onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitComment();}}}
            />
            <button onClick={submitComment} style={{background:'#4CAF50',color:'#fff',border:'none',borderRadius:11,padding:'0 16px',fontWeight:700,cursor:'pointer',flexShrink:0,fontSize:14}}>등록</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function CommWriteModal({ onClose, onSubmit, editData }) {
  const [f, setF] = useState(editData ? {title:editData.title,category:editData.category,content:editData.content,author:editData.author}
    : {title:'',category:'식물이야기',content:'',author:''});
  const [errors, setErrors] = useState({});
  const set = (k,v) => setF(p=>({...p,[k]:v}));
  const validate = () => {
    const e={};
    if(!f.title.trim()) e.title='제목을 입력해주세요';
    if(!f.content.trim()) e.content='내용을 입력해주세요';
    setErrors(e); return Object.keys(e).length===0;
  };
  const submit = () => {
    if(!validate()) return;
    if(editData) onSubmit({...editData,...f,time:editData.time+' (수정됨)'},true);
    else onSubmit({...f,author:f.author.trim()||'익명'},false);
  };
  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sheet-handle"><div className="sheet-handle-bar"/></div>
        <div className="sheet-header">
          <span className="sheet-title">{editData?'✏️ 글 수정하기':'💬 글 쓰기'}</span>
          <button className="btn-ghost" onClick={onClose} style={{fontSize:18}}>✕</button>
        </div>
        <div style={{padding:'0 20px',display:'flex',flexDirection:'column',gap:14}}>
          <div className="form-group">
            <label className="form-label">카테고리</label>
            <div style={{display:'flex',gap:7,marginTop:4,flexWrap:'wrap'}}>
              {['식물이야기','질문','자유','나눔'].map(c=>(
                <button key={c} onClick={()=>set('category',c)} style={{padding:'8px 14px',border:'1.5px solid',borderColor:f.category===c?'#4CAF50':'#e8e8e8',borderRadius:20,cursor:'pointer',fontWeight:600,fontSize:13,background:f.category===c?'#e8f5e9':'#fff',color:f.category===c?'#2e7d32':'#666',transition:'all .2s'}}>{c}</button>
              ))}
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">제목 *</label>
            <input placeholder="제목을 입력해주세요" value={f.title} onChange={e=>set('title',e.target.value)} style={{borderColor:errors.title?'#e53935':undefined}} />
            {errors.title&&<div className="err-msg">{errors.title}</div>}
          </div>
          <div className="form-group">
            <label className="form-label">내용 *</label>
            <textarea placeholder="식물 이야기, 질문, 나눔 등 자유롭게 적어주세요" value={f.content} onChange={e=>set('content',e.target.value)} style={{minHeight:160,borderColor:errors.content?'#e53935':undefined}} />
            {errors.content&&<div className="err-msg">{errors.content}</div>}
          </div>
          {!editData && (
            <div className="form-group">
              <label className="form-label">닉네임 (선택)</label>
              <input placeholder="닉네임을 입력해주세요 (미입력 시 '익명')" value={f.author} onChange={e=>set('author',e.target.value)} />
            </div>
          )}
          <div style={{paddingBottom:20}}>
            <button className="btn-primary" onClick={submit}>{editData?'수정 완료':'등록하기'}</button>
          </div>
        </div>
      </div>
    </div>
  );
}
